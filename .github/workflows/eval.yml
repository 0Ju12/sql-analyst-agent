name: 에이전트 평가

# 수동 실행: Actions 탭 → "에이전트 평가" → Run workflow
# - provider=ollama: 공개 모델을 이 러너(CPU)에서 직접 실행 (무료, 키 불필요, 느림)
# - provider=claude: Anthropic API (유료, Secrets의 ANTHROPIC_API_KEY 필요)
on:
  workflow_dispatch:
    inputs:
      provider:
        description: ollama / claude
        default: ollama
      model:
        description: "모델 ID (비우면 기본값: ollama=qwen2.5:7b, claude=claude-opus-5-5)"
        default: ""
      effort:
        description: "claude 전용: low / medium / high / xhigh / max"
        default: medium
      only:
        description: 문항 id (쉼표 구분, 비우면 전체)
        default: ""
      limit:
        description: 앞에서부터 N문항만 (0이면 전체)
        default: "0"
      max_steps:
        description: 문항당 최대 단계 수
        default: "10"

permissions:
  contents: read

env:
  OLLAMA_MODEL: ${{ inputs.model != '' && inputs.model || 'qwen2.5:7b' }}
  OLLAMA_MODELS: /home/runner/.ollama/models
  # 기본 문맥 길이는 짧아서 도구 정의·대화 기록이 잘린다
  OLLAMA_CONTEXT_LENGTH: "16384"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[claude]'
      - run: python scripts/fetch_chinook.py

      - name: Ollama 모델 캐시
        if: inputs.provider == 'ollama'
        uses: actions/cache@v4
        with:
          path: /home/runner/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}
      - name: Ollama 설치·실행
        if: inputs.provider == 'ollama'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # 설치 스크립트가 띄운 서비스 대신, 캐시 경로·문맥 길이를 지정해 직접 실행
          sudo systemctl stop ollama 2>/dev/null || true
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break; sleep 1; done
          ollama pull "$OLLAMA_MODEL"
          ollama list

      - name: 평가
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ inputs.provider }}" = "claude" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY가 없습니다."; exit 2
          fi
          model_arg=()
          if [ -n "${{ inputs.model }}" ]; then model_arg=(--model "${{ inputs.model }}"); fi
          sql-agent --db data/chinook.duckdb eval eval/chinook_tasks.yaml \
            --provider "${{ inputs.provider }}" "${model_arg[@]}" --effort "${{ inputs.effort }}" \
            --max-steps "${{ inputs.max_steps }}" \
            --only "${{ inputs.only }}" --limit "${{ inputs.limit }}" --out runs/latest
          cat runs/latest/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: 문항별 결과 (로그에 남김)
        if: always()
        run: |
          [ -f runs/latest/results.jsonl ] || exit 0
          python - <<'EOF'
          import json
          for line in open("runs/latest/results.jsonl", encoding="utf-8"):
              r = json.loads(line)
              mark = "O" if r["correct"] else "X"
              print(f"[{mark}] {r['id']} status={r['status']} steps={r['steps']} "
                    f"tool_errors={r['tool_errors']} recovered={r.get('recovered_calls', 0)} elapsed={r['elapsed_s']}s")
              print(f"    sql: {r.get('sql')}")
              print(f"    answer: {(r.get('answer') or '')[:200]}")
              if r["reason"]:
                  print(f"    reason: {r['reason']}")
              if r.get("unsupported_numbers"):
                  print(f"    답변에 근거 없는 숫자: {r['unsupported_numbers']}")
              if not r["correct"]:
                  # 틀린 문항은 도구 호출 순서를 남긴다 (결과물을 못 받는 환경에서 원인 분석용)
                  for line2 in open(f"runs/latest/traces/{r['id']}.jsonl", encoding="utf-8"):
                      ev = json.loads(line2)
                      if ev["type"] == "tool":
                          res = ev["result"]
                          note = res.get("error") if ev["is_error"] else (
                              f"rows={res.get('row_count')}" if "row_count" in res
                              else f"ok={res.get('ok')}" if "ok" in res else "")
                          print(f"      {ev['step']:>2} {ev['name']} {json.dumps(ev['args'], ensure_ascii=False)[:160]} → {str(note)[:160]}")
                      elif ev["type"] == "model" and not ev["tool_calls"]:
                          print(f"      {ev['step']:>2} (글로만 답함) {ev['text'][:160]!r}")
          EOF
      - name: Ollama 로그
        if: failure() && inputs.provider == 'ollama'
        run: tail -50 ollama.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ inputs.provider }}-${{ github.run_id }}
          path: runs/latest/
          if-no-files-found: warn
          retention-days: 30
